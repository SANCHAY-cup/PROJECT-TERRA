; PROJECT T.E.R.R.A. - Tethered Emergency Reconnaissance & Rescue Assistant
[platformio]
default_envs = nano
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -D TERRA_VERSION=\"0.1.0\"
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    fastled/FastLED@^3.7.0

; ---- Robot controller: Arduino Nano (as in the project documentation) ----
[env:nano]
platform = atmelavr
board = nanoatmega328new
lib_deps =
    ${env.lib_deps}
    feilipu/FreeRTOS@^11.1.0-3
build_flags =
    ${env.build_flags}
    -D TERRA_NANO

; ---- Alternative: ESP32 (FreeRTOS is built in, more RAM headroom) ----
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D TERRA_ESP32

; ---- ESP32-S3 WROOM N16R8 (16 MB flash, 8 MB octal PSRAM): camera + thermal grid + live viewer ----
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; N16R8 = quad flash + octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -D TERRA_ESP32S3
    -D BOARD_HAS_PSRAM
